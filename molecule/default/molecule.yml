---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: qemu
platforms:
  - name: instance
    # yamllint disable-line rule:quoted-strings
    box: "${VAGRANT_BOX:-cloud-image/debian-12}"
    memory: 2048
    cpus: 1
provisioner:
  name: ansible
  connection_options:
    ansible_become: true
    ansible_ssh_user: vagrant
