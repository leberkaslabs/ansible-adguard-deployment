---
argument_specs:
  main:
    author: Niclas Spreng
    description: Setup AdGuard Home with Docker Compose.
    short_description: adguard_docker
    options:
      adguard_docker_image:
        type: str
        required: true
        description: AdGuard Docker image to use.
      adguard_docker_path:
        type: str
        required: true
        description: Directory path for AdGuard deployment.
      adguard_docker_owner:
        type: str
        required: true
        description: Owner of AdGuard files and directories.
      adguard_docker_group:
        type: str
        required: true
        description: Group of AdGuard files and directories.
