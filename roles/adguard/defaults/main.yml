---
# AdGuard Home Docker image to use
# Set to the latest available version for up-to-date features
adguard_docker_image: adguard/adguardhome:latest

# Directory path for AdGuard Home deployment
# Location where Docker Compose files and configs are stored
adguard_docker_path: /opt/adguard

# Owner of AdGuard Home Docker files and directories
# Usually set to the root user for full control
adguard_docker_owner: root

# Group associated with AdGuard Home Docker files
# Typically the root group for permissions management
adguard_docker_group: root
