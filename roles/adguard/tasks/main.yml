---
- name: Create AdGuard Home directory
  ansible.builtin.file:
    path: "{{ adguard_docker_path }}"
    owner: "{{ adguard_docker_owner }}"
    group: "{{ adguard_docker_group }}"
    state: directory
    mode: "0750"

- name: Create AdGuard Home Docker Compose configuration
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ adguard_docker_path }}/compose.yaml"
    owner: "{{ adguard_docker_owner }}"
    group: "{{ adguard_docker_group }}"
    mode: "0640"
  notify: restart adguard

- name: Validate AdGuard Home Docker Compose configuration
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ adguard_docker_path }}"
  changed_when: false

- name: Starte AdGuard Home Docker Compose deployment
  ansible.builtin.command:
    cmd: docker compose --ansi never --progress plain up --detach
    chdir: "{{ adguard_docker_path }}"
  register: _adguard
  changed_when: "'Started' in _adguard.stdout"
